<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elegant Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap"
    />
    <style>
      body {
        font-family: "Cinzel", serif;
      }

      .nav-link {
        position: relative;
        transition: all 0.3s ease;
      }

      .nav-link:hover {
        color: #d4af37;
      }

      /* Hero Section Styles */
      .hero-section {
        position: relative;
        background: linear-gradient(180deg, #000000 0%, #0a0a0a 100%);
      }

      /* Background Images */
      .hero-bg-left,
      .hero-bg-center,
      .hero-bg-right {
        position: absolute;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        z-index: 1;
      }

      .hero-bg-left {
        left: 19%;
        top: 12%;
        transform: translateY(-50%);
        width: 400px;
        height: 600px;
        background-image: url(images/character-right.png);
        animation: floatCenterSide 6s ease-in-out infinite;
      }

      .hero-bg-center {
        left: 48%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 500px;
        height: 700px;
        background-image: url(images/character-center.png);
        animation: floatCenter 5s ease-in-out infinite;
        z-index: 2;
      }

      .hero-bg-right {
        right: 23%;
        top: 15%;
        transform: translateY(-50%);
        width: 400px;
        height: 600px;
        background-image: url(images/character-left.png);
        animation: floatCenterSide 6s ease-in-out infinite;
      }

      /* Floating animations */
      @keyframes floatLeft {
        0%,
        100% {
          transform: translateY(-50%) translateX(0);
        }
        50% {
          transform: translateY(-50%) translateX(-20px);
        }
      }

      @keyframes floatCenter {
        0%,
        100% {
          transform: translate(-50%, -50%) translateY(0);
        }
        50% {
          transform: translate(-50%, -50%) translateY(-6px);
        }
      }
      @keyframes floatCenterSide {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes floatRight {
        0%,
        100% {
          transform: translateY(-50%) translateX(0);
        }
        50% {
          transform: translateY(-50%) translateX(20px);
        }
      }

      /* Hero Title */
      .hero-title {
        background: linear-gradient(
          135deg,
          #d4af37 0%,
          #f4e4b3 50%,
          #d4af37 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 60px rgba(212, 175, 55, 0.4);
        letter-spacing: 0.05em;
        animation: titleGlow 3s ease-in-out infinite;
      }

      @keyframes titleGlow {
        0%,
        100% {
          filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.5));
        }
        50% {
          filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.8));
        }
      }

      /* Hero Subtitle */
      .hero-subtitle {
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }

      /* Hero Button */
      .hero-button {
        background: linear-gradient(135deg, #d4af37 0%, #f4e4b3 100%);
        color: #000;
        border: 2px solid #d4af37;
        border-radius: 8px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        position: relative;
        overflow: hidden;
      }

      .hero-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        transition: left 0.5s ease;
        z-index: 5;
      }

      .hero-button:hover::before {
        left: 100%;
      }

      .hero-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 30px rgba(212, 175, 55, 0.5);
      }

      .hero-button:active {
        transform: translateY(0);
      }

      /* Responsive adjustments */
      @media (max-width: 1024px) {
        .hero-bg-left,
        .hero-bg-right {
          width: 300px;
          height: 450px;
        }

        .hero-bg-center {
          width: 400px;
          height: 550px;
        }
      }

      @media (max-width: 768px) {
        .hero-bg-left,
        .hero-bg-right {
          opacity: 0.3;
          width: 200px;
          height: 350px;
        }

        .hero-bg-center {
          width: 300px;
          height: 450px;
          opacity: 0.5;
        }

        .hero-title {
          font-size: 3.5rem;
        }
      }

      @media (max-width: 640px) {
        .hero-title {
          font-size: 2.5rem;
        }

        .hero-subtitle {
          font-size: 1rem;
        }

        .nav-links {
          display: none;
        }
      }
    </style>
  </head>
  <body class="bg-black">
    <nav class="bg-black border-b border-gray-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-24">
          <!-- Logo -->
          <div class="flex-shrink-0">
            <img src="images/logo.png" alt="Logo" class="h-16 w-16" />
          </div>
          <!-- Navigation Links -->
          <div class="nav-links flex items-center space-x-12">
            <a
              href="#"
              class="nav-link text-yellow-600 text-sm font-medium tracking-wider uppercase"
              >HOME</a
            >
            <a
              href="#"
              class="nav-link text-yellow-600 text-sm font-medium tracking-wider uppercase"
              >GUIDE</a
            >
            <a
              href="#"
              class="nav-link text-yellow-600 text-sm font-medium tracking-wider uppercase"
              >MARKET</a
            >
            <a
              href="#"
              class="nav-link text-yellow-600 text-sm font-medium tracking-wider uppercase"
              >MY DECK</a
            >
            <a
              href="#"
              class="nav-link text-yellow-600 text-sm font-medium tracking-wider uppercase"
              >FAVORIS</a
            >
          </div>
          <!-- Cart Icon -->
          <div class="flex-shrink-0">
            <a href="#" class="relative inline-block">
              <svg
                class="w-7 h-7 text-yellow-600"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
                />
              </svg>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section
      class="hero-section relative min-h-screen flex items-center justify-center overflow-hidden"
    >
      <!-- Background Images -->
      <div class="hero-bg-left"></div>
      <div class="hero-bg-center"></div>
      <div class="hero-bg-right"></div>

      <!-- Overlay for better text readability -->
      <div class="absolute inset-0 bg-black/40 z-10"></div>

      <!-- Content -->
      <div class="relative z-20 text-center px-4 max-w-5xl mx-auto">
        <h1 class="hero-title text-5xl md:text-8xl lg:text-8xl font-bold mb-6">
          ETERNALS SUMMONERS
        </h1>
        <p
          class="hero-subtitle text-l md:text-xl text-gray-300 mb-10 max-w-3xl mx-auto leading-relaxed"
        >
          Enter a world where strategy meets destiny. Summon legendary heroes,
          forge powerful decks, and dominate the battlefield in the ultimate
          card game experience.
        </p>
        <button
          class="hero-button group relative px-12 py-5 text-lg font-semibold uppercase tracking-wider overflow-hidden"
        >
          <span class="relative z-10">Play Now</span>
        </button>
      </div>
    </section>
  </body>
</html>
